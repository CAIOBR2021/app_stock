<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: teclado virtual REDIMENSIONA o layout
         (Android) em vez de cobrir o input; no iOS o ajuste é via visualViewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Controle de Estoque</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tema: aplicado ANTES do React montar.
         Se esperasse o app subir, o operador veria a tela branca piscar antes
         de escurecer a cada carregamento. Roda síncrono e sem dependências de
         propósito. A chave e os valores acompanham src/theme.ts; o JSON.parse
         existe porque safeLocalStorageSet grava com aspas ("escuro"). -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('tema');
          var tema = salvo ? JSON.parse(salvo) : 'sistema';
          if (tema !== 'claro' && tema !== 'escuro') tema = 'sistema';
          var escuro =
            tema === 'escuro' ||
            (tema === 'sistema' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var raiz = document.documentElement;
          raiz.setAttribute('data-theme', escuro ? 'dark' : 'light');
          raiz.setAttribute('data-bs-theme', escuro ? 'dark' : 'light');
          // Pinta o fundo já: o CSS do app só chega depois deste script.
          raiz.style.backgroundColor = escuro ? '#121316' : '#F7F8FA';
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>

    <!-- Scripts para Geração de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
